<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141c18"/>
      <stop offset="50%" stop-color="#0c120f"/>
      <stop offset="100%" stop-color="#060907"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="150" y1="150" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
