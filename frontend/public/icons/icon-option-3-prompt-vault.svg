  <!-- Símbolo del Prompt Terminal en el corazón de la bóveda -->
  <path d="M200 195 L270 256 L200 317" stroke="#34d399" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="290" y1="317" x2="350" y2="317" stroke="#34d399" stroke-width="22" stroke-linecap="round"/>

  <!-- Pernos de seguridad de caja fuerte -->
  <circle cx="256" cy="115" r="10" fill="#10a37f"/>
  <circle cx="395" cy="256" r="10" fill="#10a37f"/>
  <circle cx="256" cy="395" r="10" fill="#10a37f"/>
  <circle cx="117" cy="256" r="10" fill="#10a37f"/>
