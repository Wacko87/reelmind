<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c221e"/>
      <stop offset="50%" stop-color="#1c1816"/>
      <stop offset="100%" stop-color="#12100f"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="180" y1="180" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2a68d"/>
      <stop offset="100%" stop-color="#cc785c"/>
    </linearGradient>
    <filter id="glow1" x="50" y="50" width="412" height="412" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad1)" stroke="#44352f" stroke-width="6"/>

  <!-- Anillo exterior de película con perforaciones -->
  <circle cx="256" cy="256" r="180" stroke="#cc785c" stroke-width="14" stroke-dasharray="28 20" opacity="0.45"/>

  <!-- Carrete interior biselado -->
  <circle cx="256" cy="256" r="130" stroke="#f2a68d" stroke-width="8" fill="#1c1816" opacity="0.9"/>

  <!-- Botón Play Central Estilizado -->
  <g filter="url(#glow1)">
    <path d="M220 180 L330 256 L220 332 Z" fill="url(#terracotta)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Destello de IA Superior Derecho (4 puntas) -->
  <path d="M345 145 L354 110 L363 145 L398 154 L363 163 L354 198 L345 163 L310 154 Z" fill="#ffcca8"/>

  <!-- Nodos Neuronales Conectados -->
  <circle cx="155" cy="190" r="12" fill="#cc785c"/>
  <circle cx="155" cy="322" r="12" fill="#cc785c"/>
  <circle cx="256" cy="370" r="12" fill="#cc785c"/>
  <line x1="155" y1="190" x2="205" y2="225" stroke="#cc785c" stroke-width="6" stroke-dasharray="6 6"/>
  <line x1="155" y1="322" x2="205" y2="287" stroke="#cc785c" stroke-width="6" stroke-dasharray="6 6"/>
</svg>
