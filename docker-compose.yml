services:
  reelmind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reelmind
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATA_DIR=/data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AUTH_PIN=${AUTH_PIN:-}
    volumes:
      - ./data:/data
    networks:
      br0.11:
        ipv4_address: 192.168.11.237
    labels:
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8000]"

networks:
  br0.11:
    name: br0.11
    external: true
